name: build-android

on:
  workflow_dispatch:
  push:
    paths:
      - "mirvex-android.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o mirvex-android.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: mirvex-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp mirvex-android/app/build/outputs/apk/debug/app-debug.apk mirvex-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mirvex-debug-apk
          path: mirvex-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MIRVEX debug build ${{ github.run_number }}
          files: mirvex-debug.apk
